name: coastaltutor-deeptutor

services:
  deeptutor:
    image: coastaltutor/deeptutor:1.7.1-sso1
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
      - "127.0.0.1:3782:3782"
    volumes:
      - ./data:/app/data
      - ./data/user/workspace:/workspace
    environment:
      TZ: America/Vancouver
      DEEPTUTOR_WORKSPACE_ROOT: /workspace
      DEEPTUTOR_WORKSPACE_ALLOWED_ROOTS: /workspace
      DEEPTUTOR_HOST_SSO_ENABLED: ${DEEPTUTOR_HOST_SSO_ENABLED:-true}
      DEEPTUTOR_HOST_SSO_SECRET: ${DEEPTUTOR_HOST_SSO_SECRET:?Set DEEPTUTOR_HOST_SSO_SECRET in the local .env file}
      PLATFORM_AI_ENABLED: ${PLATFORM_AI_ENABLED:-true}
      PLATFORM_AI_ENFORCE_USAGE_LIMITS: ${PLATFORM_AI_ENFORCE_USAGE_LIMITS:-false}
      PLATFORM_AI_PROVIDER: ${PLATFORM_AI_PROVIDER:-siliconflow}
      PLATFORM_AI_MODEL: ${PLATFORM_AI_MODEL:-siliconflow:deepseek-ai/DeepSeek-V3}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      PLATFORM_AI_INTERNAL_TOKEN: ${PLATFORM_AI_INTERNAL_TOKEN:-}
      COASTALTUTOR_PLATFORM_AI_URL: ${COASTALTUTOR_PLATFORM_AI_URL:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
